name: Bump cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [commit-plus-released]

permissions:
  contents: write

concurrency:
  group: bump-cask
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      CASK_PATH: Casks/commit-plus.rb
      SOURCE_REPO: Commit-Plus/commit-plus
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release
        id: latest
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo "$SOURCE_REPO" --json tagName --jq .tagName)
          VERSION="${TAG#v}"
          CURRENT=$(sed -nE 's/^  version "([^"]+)"$/\1/p' "$CASK_PATH")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Latest: $VERSION, cask: $CURRENT"

      - name: Update cask
        if: steps.latest.outputs.version != steps.latest.outputs.current
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          DMG="Commit+-${VERSION}-arm64.dmg"
          gh release download "v${VERSION}" --repo "$SOURCE_REPO" --pattern "$DMG" --dir "$RUNNER_TEMP"
          SHA256=$(sha256sum "$RUNNER_TEMP/$DMG" | cut -d' ' -f1)
          sed -i -E \
            -e "s/^  version \"[^\"]+\"$/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \"[0-9a-f]+\"$/  sha256 \"${SHA256}\"/" \
            "$CASK_PATH"
          grep -q "version \"${VERSION}\"" "$CASK_PATH"
          grep -q "sha256 \"${SHA256}\"" "$CASK_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"
          git commit -m "commit-plus ${VERSION}"
          git push
